  <script>
document.addEventListener("DOMContentLoaded", function () {
  const video = document.getElementById("game_video");
  const btn = document.querySelector(".audio_btn");
  const iconOff = btn?.querySelector(".icon_sound_off");
  const iconOn = btn?.querySelector(".icon_sound_on");
  if (!video || !btn || !iconOff || !iconOn) return;
  video.muted = true;
  btn.setAttribute("role", "button");
  btn.setAttribute("tabindex", "0");
  function updateSound() {
    const isMuted = video.muted || video.volume === 0;
    iconOff.style.display = isMuted ? "block" : "none";
    iconOn.style.display = isMuted ? "none" : "block";
    btn.setAttribute(
      "aria-label",
      isMuted ? "開啟聲音" : "關閉聲音"
    );
    btn.setAttribute("aria-pressed", String(!isMuted));
  }
  function toggleSound(e) {
    e.preventDefault();
    e.stopPropagation();
    const isMuted = video.muted || video.volume === 0;
    if (isMuted) {
      video.volume = 1;
      video.muted = false;
    } else {
      video.muted = true;
    }
  }
  btn.addEventListener("click", toggleSound);
  btn.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      btn.click();
    }
  });
  video.addEventListener("volumechange", updateSound);
  updateSound();
});
</script>
